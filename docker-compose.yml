services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nekoflow}
      POSTGRES_USER: ${POSTGRES_USER:-nekoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nekoflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Cria o database do Umami em volumes novos (deploys do zero).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nekoflow} -d ${POSTGRES_DB:-nekoflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics self-hosted (fonte da verdade de trafego). Dashboard em :3001.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nekoflow}:${POSTGRES_PASSWORD:-nekoflow}@postgres:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-nekoflow-umami-dev-secret-change-me}
    ports:
      - "${UMAMI_PORT:-3001}:3000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-nekoflow}
      DB_USER: ${DB_USER:-nekoflow}
      DB_PASSWORD: ${DB_PASSWORD:-nekoflow}
      SERVER_PORT: ${SERVER_PORT:-8080}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:5173}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-nekoflow-dev-secret-please-change-this-key}
      APP_JWT_ACCESS_EXPIRATION_SECONDS: ${APP_JWT_ACCESS_EXPIRATION_SECONDS:-3600}
      APP_JWT_REFRESH_EXPIRATION_SECONDS: ${APP_JWT_REFRESH_EXPIRATION_SECONDS:-2592000}
      APP_SEEKSTREAMING_ENDPOINT: ${APP_SEEKSTREAMING_ENDPOINT:-https://seekstreaming.com}
      APP_SEEKSTREAMING_API_TOKEN: ${APP_SEEKSTREAMING_API_TOKEN:-}
      APP_WORKER_RSS_POLL_ENABLED: ${APP_WORKER_RSS_POLL_ENABLED:-false}
      APP_WORKER_RSS_POLL_INTERVAL_MS: ${APP_WORKER_RSS_POLL_INTERVAL_MS:-1800000}
      APP_WORKER_RSS_POLL_INITIAL_DELAY_MS: ${APP_WORKER_RSS_POLL_INITIAL_DELAY_MS:-60000}
      APP_WORKER_RSS_POLL_LEASE_SECONDS: ${APP_WORKER_RSS_POLL_LEASE_SECONDS:-600}
      APP_GOOGLE_CLIENT_ID: ${APP_GOOGLE_CLIENT_ID:-}
      APP_WORKER_WEBHOOK_SECRET: ${APP_WORKER_WEBHOOK_SECRET:-}
      APP_BOOTSTRAP_ENABLED: ${APP_BOOTSTRAP_ENABLED:-true}
      APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME:-NekoFlow Admin}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@nekoflow.app}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-12345678}
      APP_BOOTSTRAP_USER_NAME: ${APP_BOOTSTRAP_USER_NAME:-Hikari Tanaka}
      APP_BOOTSTRAP_USER_EMAIL: ${APP_BOOTSTRAP_USER_EMAIL:-hikari@nekoflow.app}
      APP_BOOTSTRAP_USER_PASSWORD: ${APP_BOOTSTRAP_USER_PASSWORD:-12345678}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_UMAMI_SRC: ${VITE_UMAMI_SRC:-http://localhost:3001/script.js}
      VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
      VITE_UMAMI_SHARE_URL: ${VITE_UMAMI_SHARE_URL:-}
      VITE_GA4_ID: ${VITE_GA4_ID:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  postgres_data:
