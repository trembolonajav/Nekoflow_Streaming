# Headers de seguranca compartilhados.
#
# IMPORTANTE (comportamento do nginx): um bloco `location` que define QUALQUER
# `add_header` proprio deixa de herdar os `add_header` do server. Por isso este
# snippet e incluido no server E em cada location que tem add_header proprio
# (ex.: Cache-Control), garantindo que os headers de seguranca sejam aplicados
# em todas as respostas (HTML, assets, sitemap, API, player).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS: efetivo apenas sob HTTPS (ignorado em HTTP); seguro deixar sempre.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP em modo report-only: NAO bloqueia nada, apenas registra violacoes.
# frame-src limitado aos dominios do player oficial (allowlist de embed) + Google login.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://graphql.anilist.co https://accounts.google.com; frame-src https://accounts.google.com https://nekoflow.seekplayer.me https://seekplayer.me https://seekstreaming.com" always;
