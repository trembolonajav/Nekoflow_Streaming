server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Headers de seguranca no server; re-incluidos nos locations que tem add_header proprio.
    include /etc/nginx/snippets/security-headers.conf;

    # Bypass do shell: o backend busca o index.html buildado por AQUI (nunca pela
    # rota renderizada), evitando loop. Tambem usado como fallback.
    location = /__spa_index.html {
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Assets com hash do Vite: estatico, cache longo. ^~ impede a regex de assumir.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Demais arquivos estaticos (favicon, imagens, fontes, manifest): estatico.
    # Nao inclui .txt/.xml (robots/sitemap tem location exato e vao ao backend).
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|ttf|eot|map|json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        add_header Cache-Control "public, max-age=300" always;
        proxy_pass http://backend:8080/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        add_header Cache-Control "public, max-age=300" always;
        proxy_pass http://backend:8080/llms.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        add_header Cache-Control "public, max-age=300" always;
        proxy_pass http://backend:8080/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/sitemap-[a-z-]+\.xml$ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        add_header Cache-Control "public, max-age=300" always;
        proxy_pass http://backend:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Umami (analytics) no mesmo dominio: script e coleta via proxy — https sem
    # mixed content e mais resistente a adblock. Resolucao em tempo de request
    # (variavel + resolver) para o nginx subir mesmo se o umami estiver fora.
    location = /umami/script.js {
        resolver 127.0.0.11 valid=30s;
        set $umami_upstream http://umami:3000;
        proxy_pass $umami_upstream/script.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /umami/api/send {
        resolver 127.0.0.11 valid=30s;
        set $umami_upstream http://umami:3000;
        proxy_pass $umami_upstream/api/send;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rotas de DOCUMENTO/HTML: render server-side no backend com o head enriquecido.
    # Se o backend falhar, cai no fallback estatico (@spa_fallback) - sem regressao.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        rewrite ^ /api/v1/seo/render break;
        proxy_pass http://backend:8080;
    }

    # Fallback: serve o index.html estatico (comportamento anterior) se o render falhar.
    location @spa_fallback {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
}
