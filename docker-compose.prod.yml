services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB obrigatorio}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Cria o database do Umami em volumes novos; em volume existente, criar manualmente.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics self-hosted. O site publico consome via proxy do nginx do frontend
  # (/umami/script.js e /umami/api/send); o dashboard NAO e exposto publicamente —
  # acesso via tunel SSH (porta 3001 apenas em localhost da VM).
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET obrigatorio}
    ports:
      - "127.0.0.1:3001:3000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME obrigatorio}
      DB_USER: ${DB_USER:?DB_USER obrigatorio}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatorio}
      SERVER_PORT: 8080
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:?APP_PUBLIC_BASE_URL obrigatorio}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS obrigatorio}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET obrigatorio}
      APP_JWT_ACCESS_EXPIRATION_SECONDS: ${APP_JWT_ACCESS_EXPIRATION_SECONDS:-3600}
      APP_JWT_REFRESH_EXPIRATION_SECONDS: ${APP_JWT_REFRESH_EXPIRATION_SECONDS:-2592000}
      APP_ANILIST_ENDPOINT: ${APP_ANILIST_ENDPOINT:-https://graphql.anilist.co}
      APP_SEEKSTREAMING_ENDPOINT: ${APP_SEEKSTREAMING_ENDPOINT:-https://seekstreaming.com}
      APP_SEEKSTREAMING_API_TOKEN: ${APP_SEEKSTREAMING_API_TOKEN:?APP_SEEKSTREAMING_API_TOKEN obrigatorio}
      APP_WORKER_RSS_POLL_ENABLED: ${APP_WORKER_RSS_POLL_ENABLED:-false}
      APP_WORKER_RSS_POLL_INTERVAL_MS: ${APP_WORKER_RSS_POLL_INTERVAL_MS:-1800000}
      APP_WORKER_RSS_POLL_INITIAL_DELAY_MS: ${APP_WORKER_RSS_POLL_INITIAL_DELAY_MS:-60000}
      APP_WORKER_RSS_POLL_LEASE_SECONDS: ${APP_WORKER_RSS_POLL_LEASE_SECONDS:-600}
      APP_GOOGLE_CLIENT_ID: ${APP_GOOGLE_CLIENT_ID:-}
      APP_WORKER_WEBHOOK_SECRET: ${APP_WORKER_WEBHOOK_SECRET:?APP_WORKER_WEBHOOK_SECRET obrigatorio}
      APP_BOOTSTRAP_ENABLED: ${APP_BOOTSTRAP_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME:-NekoFlow Admin}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@nekoflow.app}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_BOOTSTRAP_USER_NAME: ${APP_BOOTSTRAP_USER_NAME:-NekoFlow User}
      APP_BOOTSTRAP_USER_EMAIL: ${APP_BOOTSTRAP_USER_EMAIL:-user@nekoflow.app}
      APP_BOOTSTRAP_USER_PASSWORD: ${APP_BOOTSTRAP_USER_PASSWORD:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        # Servido pelo proprio dominio via proxy do nginx (https, a prova de adblock).
        VITE_UMAMI_SRC: ${VITE_UMAMI_SRC:-/umami/script.js}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
        VITE_UMAMI_SHARE_URL: ${VITE_UMAMI_SHARE_URL:-}
        VITE_GA4_ID: ${VITE_GA4_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      umami:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
