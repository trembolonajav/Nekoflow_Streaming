spring:
  application:
    name: nekoflow-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nekoflow}
    username: ${DB_USER:nekoflow}
    password: ${DB_PASSWORD:nekoflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # A producao tem uma V16 propria (create_worker_catalog_jobs) que nunca foi
    # para o main. Toleramos migrations aplicadas no banco mas ausentes do codigo
    # para o Flyway nao falhar por causa dela. crawl_jobs e (re)garantida na V21.
    ignore-migration-patterns: "*:missing"
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:https://nekoflow.com.br}
  frontend:
    # URL interna do frontend (nginx) para o backend buscar o shell da SPA no
    # render de SEO. Deve apontar para o bypass /__spa_index.html, nunca para "/".
    internal-url: ${APP_FRONTEND_INTERNAL_URL:http://frontend}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${APP_JWT_SECRET:nekoflow-dev-secret-please-change-this-key}
    access-token-expiration-seconds: ${APP_JWT_ACCESS_EXPIRATION_SECONDS:3600}
    refresh-token-expiration-seconds: ${APP_JWT_REFRESH_EXPIRATION_SECONDS:2592000}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:true}
    admin:
      name: ${APP_BOOTSTRAP_ADMIN_NAME:NekoFlow Admin}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@nekoflow.app}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:12345678}
    user:
      name: ${APP_BOOTSTRAP_USER_NAME:Hikari Tanaka}
      email: ${APP_BOOTSTRAP_USER_EMAIL:hikari@nekoflow.app}
      password: ${APP_BOOTSTRAP_USER_PASSWORD:12345678}
  integrations:
    anilist:
      endpoint: ${APP_ANILIST_ENDPOINT:https://graphql.anilist.co}
    seekstreaming:
      endpoint: ${APP_SEEKSTREAMING_ENDPOINT:https://seekstreaming.com}
      api-token: ${APP_SEEKSTREAMING_API_TOKEN:}
    google:
      client-id: ${APP_GOOGLE_CLIENT_ID:}
  worker:
    webhook-secret: ${APP_WORKER_WEBHOOK_SECRET:}
    rss-poll:
      # Worker automatico DESLIGADO por padrao: so caca sozinho quando habilitado.
      enabled: ${APP_WORKER_RSS_POLL_ENABLED:false}
      interval-ms: ${APP_WORKER_RSS_POLL_INTERVAL_MS:1800000}
      initial-delay-ms: ${APP_WORKER_RSS_POLL_INITIAL_DELAY_MS:60000}
      lease-seconds: ${APP_WORKER_RSS_POLL_LEASE_SECONDS:600}
    calendar-sync:
      # Sincroniza o calendario com o AniList (so animes do catalogo). Ligado por
      # padrao: e idempotente e barato (2-3 chamadas GraphQL a cada 6h).
      enabled: ${APP_WORKER_CALENDAR_SYNC_ENABLED:true}
      interval-ms: ${APP_WORKER_CALENDAR_SYNC_INTERVAL_MS:21600000}
      initial-delay-ms: ${APP_WORKER_CALENDAR_SYNC_INITIAL_DELAY_MS:120000}
      lease-seconds: ${APP_WORKER_CALENDAR_SYNC_LEASE_SECONDS:300}
